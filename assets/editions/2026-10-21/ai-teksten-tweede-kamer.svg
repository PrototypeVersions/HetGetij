<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Een spreekgestoelte met een microfoon en een tekstvel waarop een deel van de regels oranje oplicht met een klein sterretje, bij het onderzoek naar Kamerleden die hun spreekteksten met AI schrijven.">
<title>Een spreekgestoelte met een microfoon en een tekstvel waarop een deel van de regels oranje oplicht met een klein sterretje, bij het onderzoek naar Kamerleden die hun spreekteksten met AI schrijven.</title>
