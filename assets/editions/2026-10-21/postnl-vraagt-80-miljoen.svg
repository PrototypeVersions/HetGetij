<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Een straatbrievenbus met één enkele envelop in de gleuf, bij de vraag van PostNL om geld voor de postbezorging nu er steeds minder post is.">
