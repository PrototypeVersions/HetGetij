<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Een racedrone met één camera die met hoge snelheid door een oplichtende poort vliegt, bij de Delftse drone die met één camera menselijke wereldkampioenen versloeg.">
